# Satu perintah buat ngidupin semuanya:
#   docker compose -f docker/compose.yaml --env-file .env up -d --build --wait
#
# Prinsip:
#  - Cuma nginx yang punya `ports:`. Postgres/Redis nggak terekspos ke host.
#  - depends_on pakai condition: service_healthy, bukan bentuk pendek.
#  - Semua service punya healthcheck + limit resource.
#  - Rahasia dari .env, nggak ditulis di sini.

name: sre-lab

services:
  # ---------- Reverse proxy (minggu 4) ----------
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }
    logging: &default-logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------- Aplikasi ----------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # distroless: pakai binary sendiri, bukan curl/wget.
      test: ["CMD", "/app/sre-api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M, pids: 200 }
    restart: unless-stopped
    logging: *default-logging

  # ---------- Dependency ----------
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 768M }
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 192M }
    restart: unless-stopped
    logging: *default-logging

  # ---------- Observability (minggu 9–11) ----------
  prometheus:
    image: prom/prometheus:v3.13.4     # jalur LTS
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-lab-admin}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      prometheus: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }
    logging: *default-logging

  loki:
    image: grafana/loki:3.5.0
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    expose:
      - "3100"
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }
    logging: *default-logging

  # Alloy, BUKAN Promtail — Promtail EOL 2 Maret 2026.
  alloy:
    image: grafana/alloy:v1.20.1
    volumes:
      - ../observability/otel/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    expose:
      - "4317"
      - "4318"
    depends_on:
      - loki
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.8.0
    volumes:
      - ../observability/tempo/tempo-config.yml:/etc/tempo/config.yaml:ro
      - tempodata:/var/tempo
    expose:
      - "3200"
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  lokidata:
  tempodata:
