name: ci

on:
  pull_request:
  push:
    branches: [main]

# WAJIB: tulis eksplisit. Jangan andalkan default repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: vet + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go vet ./...
        working-directory: app
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
        working-directory: app

  integration:
    name: integration test (postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: labpassword
          POSTGRES_DB: sre_lab
        options: >-
          --health-cmd "pg_isready -U app -d sre_lab"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
      - run: go test -tags=integration -count=1 ./tests/integration/...
        env:
          DATABASE_URL: postgres://app:labpassword@localhost:5432/sre_lab?sslmode=disable
          REDIS_URL: redis://localhost:6379/0

  build-push:
    name: build image (tag = commit SHA)
    needs: [lint-test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "value=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Tag immutable berbasis SHA. BUKAN :latest.
          tags: ghcr.io/${{ github.repository }}/sre-api:sha-${{ steps.sha.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Attestation: bukti image ini dibangun dari commit ini oleh workflow ini.
      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/sre-api
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
