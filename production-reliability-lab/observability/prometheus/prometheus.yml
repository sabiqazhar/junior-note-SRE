global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: lab

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- Aplikasi ---
  - job_name: api
    scrape_native_histograms: true     # nggak aktif default sejak Prometheus 3.8
    static_configs:
      - targets: ["api:8080"]
        labels: { service: sre-api }

  # --- Prometheus sendiri ---
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OPSIONAL (minggu 9–10): tambahkan service cadvisor dan postgres-exporter
  # ke compose.yaml dulu sebelum mengaktifkan dua job ini. Kalau target-nya
  # belum ada, statusnya akan DOWN dan menambah noise di halaman /targets.
  #
  # - job_name: cadvisor
  #   static_configs:
  #     - targets: ["cadvisor:8080"]
  #
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]
