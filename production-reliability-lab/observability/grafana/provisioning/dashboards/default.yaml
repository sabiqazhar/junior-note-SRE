apiVersion: 1

providers:
  - name: sre-core
    orgId: 1
    folder: SRE
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    # KUNCI: false = sumber kebenaran adalah Git, bukan hasil klik-klik di UI.
    # Kalau true, perubahan di UI akan hilang saat redeploy (drift).
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
