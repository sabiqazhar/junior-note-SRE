# Reverse proxy buat lab SRE (minggu 4).
# Cuma service ini yang boleh diakses dari host.

upstream api {
    server api:8080;
    # keepalive + proxy_http_version 1.1 default ON mulai nginx 1.29.7,
    # tapi ditulis eksplisit biar jelas dan aman di versi lama.
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Batasi ukuran body — cegah request raksasa makan resource.
    client_max_body_size 2m;

    # Jangan ekspos metrics Prometheus ke publik. Akses lewat port-forward / jaringan internal.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Default nginx 60s — kepanjangan buat API. Turunkan.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        proxy_next_upstream error timeout http_502;
    }

    # Format log yang isinya cukup buat diagnosis (minggu 10 & 11).
    log_format sre '$remote_addr - [$time_iso8601] "$request" '
                   '$status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time '
                   'ua="$http_user_agent" xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log sre;
    error_log  /var/log/nginx/error.log warn;
}

# Catatan:
# 502 -> upstream nolak / connection reset  -> cek: api hidup? ss -lntp di container api
# 504 -> proxy_read_timeout habis           -> cek: endpoint lambat, query DB
# 499 -> client nutup koneksi duluan        -> cek: timeout client < proxy_read_timeout
